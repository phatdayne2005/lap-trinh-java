spring:
  application:
    name: CareerCompass

  devtools:
    # BẮT BUỘC, nếu không thì khối server.error bên dưới vô tác dụng khi chạy từ
    # IDE. spring-boot-devtools tự nạp một bộ giá trị mặc định "tiện cho lập
    # trình viên", trong đó có server.error.include-stacktrace = always, và bộ
    # đó ghi đè application.yml.
    #
    # Hệ quả đã đo được trên cùng một mã nguồn, cùng một yêu cầu GET /p/<slug sai>:
    #   java -jar   -> 404, phản hồi 102 byte, không có "trace"
    #   IntelliJ    -> 404, phản hồi 10.910 byte, có nguyên stack trace
    # Khác nhau vì spring-boot-maven-plugin loại devtools khỏi jar, còn IDE nạp
    # nó theo classpath. Bộ kiểm thử Postman chạy vào bản IDE nên báo vi phạm
    # NFR-S05, trong khi bản triển khai thật vẫn an toàn.
    add-properties: false

  # Kéo file application-local.yml (gitignored) chứa secret thật vào lúc chạy.
  # "optional:" => thiếu file vẫn boot được (teammate chưa có secret vẫn chạy local login).
  config:
    import: optional:file:application-local.yml

  # ====== DATABASE ======
  # Credentials lấy từ env var (DB_USERNAME, DB_PASSWORD).
  # Default cho dev local: root / 123456. Khi deploy prod set env var thật.
  datasource:
    url: jdbc:mysql://localhost:3306/careercompass?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ====== JPA / HIBERNATE ======
  jpa:
    hibernate:
      ddl-auto: update           # dev: tự tạo/cập nhật bảng từ @Entity. Prod KHÔNG dùng.
    show-sql: true               # in SQL ra console (để học + debug)
    open-in-view: false          # tắt OSIV để tránh N+1 query ngầm khi render view
    properties:
      hibernate:
        format_sql: true         # format SQL cho đẹp

  # ====== THYMELEAF ======
  thymeleaf:
    cache: false                 # dev: sửa HTML không cần restart

  # ====== FILE UPLOAD ======
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 12MB

  # ====== OAUTH2 CLIENT (Google Login) ======
  # Giá trị thật của client-id/secret nằm ở application-local.yml (gitignored).
  # Google là provider "well-known" của Spring Security nên không cần khai báo endpoint.
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:mock}
            client-secret: ${GOOGLE_CLIENT_SECRET:mock}
            scope:
              - openid
              - profile
              - email
  # ====== MAIL (SMTP Gmail) ======
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:mock}
    password: ${MAIL_PASSWORD:mock}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# ====== SERVER ======
server:
  port: 8080

  # NFR-S05: không để lộ stack trace, câu truy vấn SQL hay thông tin cấu hình
  # trong phản hồi lỗi. Trước khi khai tường minh, phản hồi 500 trả về nguyên
  # "trace" gồm tên package vn.uth.careercompass, tên lớp, tên method, số dòng,
  # và cả câu INSERT khi vi phạm ràng buộc khoá duy nhất.
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false


# ====== LOG ======
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE   # in cả tham số bind vào câu SQL

# ====== SEED ADMIN ======
app:
  admin:
    email: ${ADMIN_EMAIL:admin@gmail.com}
    password: ${ADMIN_PASSWORD:123456}
  student:
    email: ${STUDENT_EMAIL:student@gmail.com}
    password: ${STUDENT_PASSWORD:123456}
  counselor:
    email: ${COUNSELOR_EMAIL:counselor@gmail.com}
    password: ${COUNSELOR_PASSWORD:123456}
  mail:
    from: ${MAIL_USERNAME:mock}   # gửi từ chính địa chỉ project (mặc định mock để boot/test không cần secret)
  base-url: ${BASE_URL:http://localhost:8080}
  upload:
    dir: uploads/transcripts   # thư mục lưu bảng điểm của sinh viên


llm:
  api-key: ${GEMINI_API_KEY:mockS}
  # flash-lite nhẹ hơn -> ít bị 503 "high demand" của free-tier hơn flash thường
  model: gemini-2.5-flash-lite