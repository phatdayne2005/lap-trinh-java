name: CareerCompass CI/CD Workflow

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master", "dev" ]
  workflow_dispatch:        # cho phép bấm chạy tay từ tab Actions

# Hai lần push liên tiếp: huỷ lần chạy cũ, tránh hai job deploy giẫm chân nhau.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/careercompass

jobs:
  # ==========================================================
  # 1. TEST - chạy trên mọi push và pull request
  # ==========================================================
  build:
    name: Build and Test (Java 21 & Maven)
    runs-on: ubuntu-latest

    # Khai ở cấp job chứ không cấp step: biểu thức 'if' của một step chỉ đọc được
    # env của workflow và của job, không đọc được env của chính step đó.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: careercompass
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # SonarCloud cần toàn bộ lịch sử git để biết dòng nào là "code mới"
          # và ai sửa. Bản checkout mặc định chỉ lấy 1 commit nên Sonar sẽ cảnh báo
          # rồi coi cả dự án là code mới.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Fix line endings and permissions for mvnw
        run: |
          sed -i 's/\r$//' mvnw
          chmod +x mvnw

      - name: Build and Test with Maven
        env:
          DB_USERNAME: root
          DB_PASSWORD: root
          DB_URL: jdbc:mysql://127.0.0.1:3306/careercompass?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
          GOOGLE_CLIENT_ID: mock-client-id
          GOOGLE_CLIENT_SECRET: mock-client-secret
          GEMINI_API_KEY: mock-gemini-key
          MAIL_USERNAME: mock@gmail.com
          MAIL_PASSWORD: mockpassword
        run: ./mvnw clean verify -DskipTests=false

      # ----------------------------------------------------------
      # Phân tích chất lượng mã nguồn trên SonarCloud.
      #
      # Chạy Ở ĐÂY chứ không tách job riêng, vì bước trên vừa sinh
      # target/site/jacoco/jacoco.xml — tách job thì phải chạy lại toàn bộ
      # test chỉ để có file đó. Không có 'clean' để giữ nguyên target/.
      #
      # Cần một secret duy nhất: Settings > Secrets and variables > Actions
      # > New repository secret, tên SONAR_TOKEN, giá trị là User Token lấy ở
      # SonarCloud > My Account > Security. Nhờ vậy không ai trong nhóm phải
      # tự tạo token hay cài Docker để chạy Sonar ở máy mình.
      #
      # Điều kiện 'if' để nhánh fork hoặc repo chưa cấu hình secret thì bỏ qua
      # bước này thay vì đỏ cả pipeline.
      # ----------------------------------------------------------
      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # để Sonar bình luận vào pull request
        run: ./mvnw sonar:sonar -Dsonar.token="$SONAR_TOKEN"

      - name: Upload JAR Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CareerCompass-application
          path: target/*.jar
          retention-days: 7

  # ==========================================================
  # 2. BUILD IMAGE - chỉ khi test pass và push vào main
  #    Build ở đây để VPS không phải build (tiết kiệm RAM/thời gian).
  # ==========================================================
  docker:
    name: Build and Push Docker Image
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # cần để push lên GitHub Container Registry

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Gắn 2 tag: latest (tiện tay) và SHA commit (deploy đúng phiên bản, dễ rollback).
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================================
  # 3. E2E - kiểm thử giao diện trên app thật, CHẶN deploy nếu đỏ
  #    Chỉ chạy nhóm @P0 (~1 phút). Nhóm @P1 chạy tay khi cần hồi quy,
  #    nhóm @known-bug bị loại vì đang tố cáo lỗi chưa sửa.
  # ==========================================================
  e2e:
    name: E2E UI Tests (CodeceptJS + Playwright)
    needs: docker
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Dựng stack app + MySQL bằng image vừa build
        env:
          # Dùng đúng image của commit này, không build lại.
          APP_IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          # .env bị gitignore nên CI tự tạo bản tối thiểu để chạy test.
          cat > .env <<EOF
          DB_USERNAME=root
          DB_PASSWORD=e2e_ci_password
          DB_PORT=3306
          APP_PORT=8080
          BASE_URL=http://localhost:8080
          APP_IMAGE=$APP_IMAGE
          GOOGLE_CLIENT_ID=mock
          GOOGLE_CLIENT_SECRET=mock
          MAIL_USERNAME=mock
          MAIL_PASSWORD=mock
          GEMINI_API_KEY=mock
          ADMIN_EMAIL=admin@gmail.com
          ADMIN_PASSWORD=123456
          STUDENT_EMAIL=student@gmail.com
          STUDENT_PASSWORD=123456
          COUNSELOR_EMAIL=counselor@gmail.com
          COUNSELOR_PASSWORD=123456
          EOF
          docker compose up -d --no-build

      - name: Chờ app sẵn sàng
        run: |
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:8080/login; then
              echo "App đã sẵn sàng"; exit 0
            fi
            sleep 5
          done
          echo "App không lên sau 5 phút" >&2
          docker compose logs app --tail 50 >&2
          exit 1

      - name: Cài phụ thuộc E2E
        working-directory: e2e
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium

      - name: Chạy kiểm thử giao diện (nhóm P0)
        working-directory: e2e
        env:
          BASE_URL: http://localhost:8080
        run: npm run test:p0

      - name: Sinh báo cáo Excel
        if: always()
        working-directory: e2e
        run: npm run report || true

      - name: Đính kèm báo cáo và ảnh chụp lỗi
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bao-cao-kiem-thu-giao-dien
          path: |
            e2e/output/*.xlsx
            e2e/output/*.png
            e2e/output/result.json
          retention-days: 30

      - name: Gom log khi thất bại
        if: failure()
        run: docker compose logs app --tail 100

  # ==========================================================
  # 3. DEPLOY - SSH vào VPS, pull image mới, khởi động lại
  # ==========================================================
  deploy:
    name: Deploy to VPS
    needs: [docker, e2e]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production   # cho phép bật "required reviewers" nếu muốn duyệt trước khi deploy
    permissions:
      contents: read
      packages: read          # để VPS pull được image bằng token của workflow

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            cd ${{ secrets.VPS_APP_DIR || '~/lap-trinh-java' }}

            IMAGE="${{ env.IMAGE_NAME }}:${{ github.sha }}"
            echo "==> Deploy $IMAGE"

            # Đăng nhập GHCR bằng token tạm của workflow (hết hạn khi job kết thúc).
            echo "${{ secrets.GITHUB_TOKEN }}" \
              | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Lấy code mới (compose file, nginx config, DEPLOY.md...) nhưng KHÔNG build.
            git pull --ff-only

            # Ghi phiên bản đang chạy vào .env để lệnh docker compose thủ công
            # trên VPS sau này vẫn dùng đúng image.
            if grep -q '^APP_IMAGE=' .env; then
              sed -i "s|^APP_IMAGE=.*|APP_IMAGE=$IMAGE|" .env
            else
              echo "APP_IMAGE=$IMAGE" >> .env
            fi

            docker compose pull app
            docker compose up -d --no-build

            # Chờ app trả 200, không thì fail job và in log.
            # tr -cd '0-9' bỏ mọi thứ không phải chữ số: chặn CR (nếu .env lưu kiểu
            # CRLF từ Windows), dấu nháy và khoảng trắng - những thứ làm curl báo
            # "(3) URL using bad/illegal format".
            PORT=$(sed -n 's/^APP_PORT=//p' .env | tail -n1 | tr -cd '0-9')
            [ -n "$PORT" ] || PORT=8080
            for i in $(seq 1 60); do
              if curl -fsS -o /dev/null "http://127.0.0.1:$PORT/login"; then
                echo "==> OK: app trả HTTP 200"
                docker image prune -f
                exit 0
              fi
              sleep 5
            done

            echo "LỖI: app không phản hồi sau 5 phút" >&2
            docker compose logs app --tail 50 >&2
            exit 1

  # ==========================================================
  # 4. DỌN DẸP - xoá bản image cũ trên GHCR, chỉ giữ 5 bản gần nhất
  #    Mỗi lần deploy đẻ ra 1 tag SHA mới; không dọn thì package phình dần
  #    (tài khoản free chỉ có 500MB nếu package để private).
  # ==========================================================
  cleanup:
    name: Cleanup old images
    needs: deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    # Dọn dẹp hỏng thì KHÔNG được làm hỏng kết quả deploy (deploy đã xong xuôi rồi).
    continue-on-error: true

    steps:
      - name: Delete old package versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: careercompass
          package-type: container
          min-versions-to-keep: 5
          # Không đụng vào bản đang mang tag (latest, và SHA vừa deploy).
          ignore-versions: '^latest$'
